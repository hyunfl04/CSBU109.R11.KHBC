<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #error-message { background: #f8d7da; color: #721c24; padding: 10px; display: none; margin-bottom: 15px; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #1d4ed8; color: white; }
    .form-group { margin-bottom: 10px; }
    input, select, button { padding: 6px 10px; margin-right: 5px; }
    .btn-delete { background: #dc2626; color: white; border: none; cursor: pointer; }
    .btn-edit { background: #f59e0b; color: white; border: none; cursor: pointer; }
    .btn-save { background: #16a34a; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Product Management (Client Web UI)</h2>
  
  <div id="error-message"></div>

  <div class="form-group">
    <input type="text" id="name" placeholder="Product name">
    <input type="number" id="price" placeholder="Price (VND)">
    <input type="text" id="category" placeholder="Category">
    <button onclick="addProduct()">Add product</button>
  </div>

  <div class="form-group">
    <label>Filter by Category: </label>
    <select id="filterCategory" onchange="loadProducts()">
      <option value="All Categories">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Accessories">Accessories</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price (VND)</th>
        <th>Category</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="product-list"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
