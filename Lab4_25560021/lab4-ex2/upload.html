<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Upload & Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .upload-card {
            background: white;
            border: 2px dashed #6366f1;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .btn-upload {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-upload:hover {
            background: #4f46e5;
        }

        .gallery-title {
            margin-bottom: 15px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 6px;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            justify-content: space-around;
            font-size: 13px;
        }

        .actions a {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .actions .btn-del {
            color: #dc2626;
            cursor: pointer;
        }

        #error-msg {
            color: #dc2626;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="upload-card">
            <h2>Profile Picture</h2>
            <p>Select an image to upload as your avatar (JPG, PNG, WEBP up to 2MB)</p>
            <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp">
            <br>
            <button class="btn-upload" onclick="uploadAvatar()">Upload Avatar</button>
            <div id="error-msg"></div>
        </div>

        <h2 class="gallery-title">Uploaded Files</h2>
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5001/api/v1';

        async function uploadAvatar() {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.textContent = '';

            const fileInput = document.getElementById('avatarInput');
            if (!fileInput.files[0]) {
                errorDiv.textContent = 'Please choose an image file first!';
                return;
            }

            const formData = new FormData();
            formData.append('avatar', fileInput.files[0]);

            try {
                const response = await fetch(`${API_BASE}/upload-avatar`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.message);

                fileInput.value = ''; // Reset file picker
                loadGallery(); // Refresh gallery
            } catch (err) {
                errorDiv.textContent = err.message;
            }
        }

        async function loadGallery() {
            try {
                const response = await fetch(`${API_BASE}/files`);
                const result = await response.json();

                const gallery = document.getElementById('gallery');
                gallery.innerHTML = '';

                if (!result.data || result.data.length === 0) {
                    gallery.innerHTML = '<p>No files uploaded yet.</p>';
                    return;
                }

                result.data.forEach(file => {
                    gallery.innerHTML += `
            <div class="card">
              <img src="${file.url}" alt="${file.filename}">
              <div class="actions">
                <a href="${file.downloadUrl}">Download</a>
                <span class="btn-del" onclick="deleteFile('${file.filename}')">Delete</span>
              </div>
            </div>
          `;
                });
            } catch (err) {
                console.error('Failed to load gallery:', err);
            }
        }

        async function deleteFile(filename) {
            if (!confirm(`Delete file "${filename}"?`)) return;

            try {
                const response = await fetch(`${API_BASE}/files/${filename}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message);

                loadGallery();
            } catch (err) {
                alert(err.message);
            }
        }

        // Load gallery automatically on page load
        document.addEventListener('DOMContentLoaded', loadGallery);
    </script>
</body>

</html>
